<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Room Planner</title>

<link rel="stylesheet" href="./src/styles/main.scss">

<body>
<!-- @include src/html/sprite.html -->
<div id="app">
  <!-- @include src/html/header.html -->

  <main>
    <!-- @include src/html/pane-left.html -->

    <!-- @include src/html/stage.html -->

    <!-- @include src/html/pane-right.html -->
  </main>

  <!-- @include src/html/pane-library.html -->
</div>

<!-- @include src/html/modal.html -->

<script type="module">
"use strict";
/* ===================================================================
   Room Planner. All lengths are stored internally in millimetres.
   Rooms are closed polygons: room.points = [[x,y], ...] clockwise.

   This file is a shell. The markup is seven @include directives above;
   each partial ends with a module script that binds its own pane's
   listeners, so a pane's markup and the things listening to it live in
   one file (src/bind/, and .claude/plans/decoupling.md).

   What is left here is what belongs to no single pane: the listeners on
   `document` and `window`, the colour-scheme query, the pane-header
   toggles — which bind BOTH panes and so belong to neither — and the two
   calls that start the app.

   Order still matters, and only here. Registration order decides nothing
   between listeners on different elements; it decides everything between
   listeners on the SAME element and phase, and `document` is the one
   element several unrelated features all listen to. The four capture-phase
   handlers run ahead of every bubble-phase one regardless, but the two
   bubble keydowns below — shortcuts, then section toggling — are in the
   order they must stay in.
   =================================================================== */

import {scheduleDraw} from './src/canvas/draw.js';
import {darkMQ} from './src/canvas/paint.js';
import {edgePanTick} from './src/canvas/interaction.js';
import {resize} from './src/canvas/view.js';
import {applyLayoutMode, togglePane} from './src/plan/mode.js';
import {onDocumentKeyDown, onDocumentKeyUp} from './src/plan/shortcuts.js';
import {closeMenu, menuEl} from './src/ui/menu.js';
import {$} from './src/ui/modal.js';
import {toggleSection} from './src/ui/panels.js';
import {boot} from './src/boot.js';

/* Any open menu closes on a click outside it, Escape, a resize or a scroll.
   Capture phase, so it runs before whatever was actually clicked. */
document.addEventListener('pointerdown', e=>{ if(menuEl && !menuEl.contains(e.target)) closeMenu(); }, true);
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && menuEl) closeMenu(); }, true);
window.addEventListener('resize', closeMenu);
document.addEventListener('scroll', closeMenu, true);

/* Light/dark is a canvas concern too — the plan repaints in the new palette. */
darkMQ.addEventListener && darkMQ.addEventListener('change', ()=>scheduleDraw());

/* The edge-pan rAF loop. Exported and started here rather than running at
   import time, for the same reason boot() is: nothing in src/ may have a
   top-level side effect. */
edgePanTick();

/* Keyboard shortcuts: canvas gestures, nudging, undo. Bubble phase. */
document.addEventListener('keydown', onDocumentKeyDown);
document.addEventListener('keyup', onDocumentKeyUp);

/* The two pane headers collapse their pane. One loop, two elements, one in
   pane-left.html and one in pane-right.html — it belongs to neither partial,
   so it stays in the shell. */
for(const [headId,side] of [['headLeft','left'],['headRight','right']]){
  const h=$(headId);
  h.addEventListener('click', ()=>togglePane(side));
  h.addEventListener('keydown', e=>{
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); togglePane(side); }
  });
}

/* Section folding is delegated from `document` because every pane has
   sections and they are rebuilt by innerHTML on every render — a listener
   bound to the heading itself would not survive the next repaint. */
document.addEventListener('click', e=>{
  const h=e.target.closest('.pane-body section[data-sec] > .sec-head > h2');
  if(h) toggleSection(h);
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const h=e.target.closest && e.target.closest('.pane-body section[data-sec] > .sec-head > h2');
  if(h){ e.preventDefault(); toggleSection(h); }
});

window.addEventListener('resize', ()=>{ applyLayoutMode(); resize(); });

boot();
</script>
</body>
</html>
