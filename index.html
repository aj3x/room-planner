<body>

<div id="app">
  <!-- @include src/html/header.html -->

  <main>
    <!-- @include src/html/pane-left.html -->

    <!-- @include src/html/pane-right.html -->

</div>

<!-- @include src/html/modal.html -->

<script type="module">
"use strict";
/* ===================================================================
   Room Planner. All lengths are stored internally in millimetres.
   Rooms are closed polygons: room.points = [[x,y], ...] clockwise.
   =================================================================== */

/* ------------------------- units ------------------------- */













import {$} from './src/ui/modal.js';

import {menuEl, closeMenu} from './src/ui/menu.js';
document.addEventListener('pointerdown', e=>{ if(menuEl && !menuEl.contains(e.target)) closeMenu(); }, true);
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && menuEl) closeMenu(); }, true);
window.addEventListener('resize', closeMenu);
document.addEventListener('scroll', closeMenu, true);




/* ------------------------- view ------------------------- */
import {resize} from './src/canvas/view.js';




import {darkMQ} from './src/canvas/draw.js';
darkMQ.addEventListener && darkMQ.addEventListener('change', ()=>scheduleDraw());


import {scheduleDraw} from './src/canvas/draw.js';


import {edgePanTick} from './src/canvas/interaction.js';
edgePanTick();

import {onDocumentKeyDown, onDocumentKeyUp} from './src/plan/shortcuts.js';
document.addEventListener('keydown', onDocumentKeyDown);
document.addEventListener('keyup', onDocumentKeyUp);

/* ------------------------- panels ------------------------- */
import {applyLayoutMode} from './src/plan/mode.js';


import {togglePane} from './src/plan/mode.js';
for(const [headId,side] of [['headLeft','left'],['headRight','right']]){
  const h=$(headId);
  h.addEventListener('click', ()=>togglePane(side));
  h.addEventListener('keydown', e=>{
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); togglePane(side); }
  });
}

import {toggleSection} from './src/ui/panels.js';
document.addEventListener('click', e=>{
  const h=e.target.closest('.pane-body section[data-sec] > .sec-head > h2');
  if(h) toggleSection(h);
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const h=e.target.closest && e.target.closest('.pane-body section[data-sec] > .sec-head > h2');
  if(h){ e.preventDefault(); toggleSection(h); }
});










































window.addEventListener('resize', ()=>{ applyLayoutMode(); resize(); });
import {boot} from './src/boot.js';
boot();
</script>
</body>
</html>
