<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Room Planner</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cstyle%3Epath%7Bfill:none;stroke:%231d1d1b;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round%7D@media (prefers-color-scheme:dark)%7Bpath%7Bstroke:%23ececea%7D%7D%3C/style%3E%3Cpath d='M2 2h12v12H2z'/%3E%3Cpath d='M2 8h5v6M10 2v4h4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/app/styles/main.scss">
</head>
<body>
<!-- @include src/ui-kit/sprite.html -->
<div id="app">
  <!-- The page is a shell of empty places: boot() renders the header, the
       controls over the canvas, the panes' heads, each pane section (its
       feature's, app/slots.js) and the Library page into them. -->
  <header id="header"></header>

  <main>
    <div class="pane left" id="paneRoom">
      <div class="slot" id="paneHeadLeft"></div>
      <div class="pane-body">
        <section data-sec="layout"></section>
        <section data-sec="things" class="for-furn"></section>
        <section data-sec="walls" class="for-room"></section>
        <section data-sec="openings" class="for-room"></section>
        <section data-sec="structure" class="for-room"></section>
      </div>
    </div>

    <div id="stage">
      <canvas id="cv" aria-label="Floor plan"></canvas>
      <div class="slot" id="stageControls"></div>
    </div>

    <div class="pane right" id="paneStuff">
      <div class="slot" id="paneHeadRight"></div>
      <div class="pane-body">
        <section data-sec="sel" class="for-furn"></section>
        <section data-sec="roomsel" class="for-room"></section>
        <section data-sec="floorsel" class="for-floor"></section>
        <section data-sec="floorprops" class="for-floor"></section>
        <section data-sec="shape" class="for-room"></section>
        <section data-sec="stock" class="for-furn"></section>
        <section data-sec="drawing"></section>
      </div>
    </div>
  </main>

  <div id="paneLibrary"></div>
</div>

<!-- @include src/ui-kit/modal.html -->

<script type="module">
"use strict";
/* ===================================================================
   Room Planner. All lengths are stored internally in millimetres.
   Rooms are closed polygons: room.points = [[x,y], ...] clockwise.

   This file is a shell: the markup above is the places the app renders
   into, and what is left here is what belongs to no single part of the
   page — the listeners on `document` and `window` that are not keys, the
   colour-scheme query, the keyboard's one registration, and the calls
   that start the app.

   Order matters only between listeners on the same element and phase.
   The keyboard is one listener per phase (app/shortcuts.js), whose
   shortcuts are ordered by priority, not by when they were added.
   =================================================================== */

import {scheduleDraw, resize} from './src/features/canvas/index.js';
import {darkMQ, edgePanTick} from './src/features/canvas/host.js';
import {applyLayoutMode} from './src/features/mode/index.js';
import {bindKeys} from './src/app/shortcuts.js';
import {closeMenu, menuEl} from './src/ui-kit/menu.js';
import {boot} from './src/app/boot.js';

/* Any open menu closes on a click outside it, a resize or a scroll (and on
   Escape: app/shortcuts.js). Capture phase, so it runs before whatever was
   actually clicked. */
document.addEventListener('pointerdown', e=>{ if(menuEl && !menuEl.contains(e.target)) closeMenu(); }, true);
window.addEventListener('resize', closeMenu);
document.addEventListener('scroll', closeMenu, true);

/* Light/dark is a canvas concern too — the plan repaints in the new palette. */
darkMQ.addEventListener && darkMQ.addEventListener('change', ()=>scheduleDraw());

/* The edge-pan rAF loop. Exported and started here rather than running at
   import time, for the same reason boot() is: nothing in src/ may have a
   top-level side effect. */
edgePanTick();

/* The keyboard: canvas gestures and tools, commands, nudging, undo. */
bindKeys();

window.addEventListener('resize', ()=>{ applyLayoutMode(); resize(); });

boot();
</script>
</body>
</html>
